name: Bot de ofertas Shopee

on:
  schedule:
    # UTC 11:00-00:55 = 08:00-21:55 no horário de Brasília (combina com HORA_INICIO/HORA_FIM)
    - cron: "*/5 11-23,0 * * *"
  workflow_dispatch:
    inputs:
      comando:
        description: "ofertas = só mostra | teste = posta 1 agora | uma = rodada normal"
        default: "ofertas"
        type: choice
        options:
          - ofertas
          - teste
          - uma

permissions:
  contents: write

# Nunca roda duas execuções ao mesmo tempo (evita conflito no postados.json)
concurrency:
  group: bot-ofertas
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TZ: America/Sao_Paulo

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip            # acelera as próximas execuções

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o bot
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CANAL: ${{ secrets.CANAL }}
          PALAVRAS: "fone bluetooth,smartwatch,carregador turbo,caixa de som bluetooth,fone de ouvido sem fio,capinha celular,cabo usb tipo c,lanterna led,organizador cozinha,luminária led,mochila,tênis masculino,relógio digital,garrafa térmica,kit maquiagem,ventilador portátil"
          DESCONTO_MIN: "30"
          VENDAS_MIN: "100"
          AVALIACAO_MIN: "4.5"
          ORDENAR: "2"
          HORA_INICIO: "8"
          HORA_FIM: "22"
          PROBABILIDADE: "1"
        run: python bot_auto.py "${{ github.event.inputs.comando || 'uma' }}"

      - name: Salvar lista de produtos já postados
        # Só commita se o bot realmente alterou o arquivo (e nunca no modo "ofertas")
        if: always() && github.event.inputs.comando != 'ofertas'
        run: |
          if [ -f postados.json ] && ! git diff --quiet -- postados.json; then
            git config user.name "bot-ofertas"
            git config user.email "bot-ofertas@users.noreply.github.com"
            git add postados.json
            git commit -m "atualiza lista de postados [skip ci]"
            # tenta até 3 vezes caso outro push tenha acontecido no meio
            for i in 1 2 3; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
              sleep 3
            done
          else
            echo "postados.json sem mudanças, nada a commitar."
          fi
