name: Bot de ofertas Shopee

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-shopee
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Mantenha aqui os passos existentes do bot.
      # Exemplo:
      # - name: Executar bot
      #   run: python main.py
      #   env:
      #     PROBABILIDADE: "1"

      - name: Atualizar lista e enviar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main || {
            echo "Conflito ao sincronizar; o rebase foi cancelado."
            git rebase --abort
            exit 1
          }

          git add .
          git diff --cached --quiet && echo "Nenhuma alteração" || {
            git commit -m "Atualiza lista de postados"
            git push origin main
          }
